<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Training Evaluation | The Scanland Group</title>
  <meta name="robots" content="noindex, nofollow">
  <!--
    Evaluations now live in the courses system (courses.thescanlandgroup.com/evaluate).
    This page only forwards old links and QR codes there:
      /evaluation?course=strategic-decision-making&session=Group  ->  /evaluate/strategic-decision-making?session=Group
      /evaluation?training=Strategic%20Decision%20Making           ->  /evaluate/strategic-decision-making
      /evaluation                                                  ->  /evaluate (people pick their training)
    To add or change a course's questions, use the course editor in the courses admin.
  -->
  <meta http-equiv="refresh" content="3;url=https://courses.thescanlandgroup.com/evaluate">
  <link rel="stylesheet" href="/assets/tsg.css?v=20261015">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <script>
    (function () {
      var base = "https://courses.thescanlandgroup.com/evaluate";
      var p = new URLSearchParams(location.search);
      var slugify = function (s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); };
      var slug = slugify(p.get("course") || p.get("training") || "");
      var out = new URLSearchParams();
      if (p.get("session")) out.set("session", p.get("session"));
      var q = out.toString();
      location.replace(base + (slug ? "/" + slug : "") + (q ? "?" + q : ""));
    })();
  </script>
</head>
<body>
  <main style="max-width: 560px; margin: 3rem auto 0; padding: 0 1rem;">
    <div style="background: rgba(255,255,255,0.96); border-radius: 12px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 4px 16px rgba(31,47,121,0.12);">
      <h1 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Opening the evaluation...</h1>
      <p>If nothing happens, <a href="https://courses.thescanlandgroup.com/evaluate" style="font-weight: bold; text-decoration: underline;">open the training evaluation here</a>.</p>
    </div>
  </main>
</body>
</html>
